        .fullscreen-link {

            width: 100%;

        .tap-hint {
            position: fixed;

            left: 50%;
            transform: translateX(-50%);

            backdrop-filter: blur(10px);
            color: white;

            border-radius: 50px;

            z-index: 100;

            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
        }
