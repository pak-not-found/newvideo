<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Maryam - Let's Connect & Chat!</title>
    <meta name="description" content="Join Maryam for a friendly chat. Click to start conversation!">

    <meta property="og:title" content="Maryam - Let's Connect & Chat!">
    <meta property="og:description" content="✨ Click here to start chatting with Maryam. Friendly and welcoming! ✨">
    <meta property="og:image" content="https://raw.githubusercontent.com/pak-not-found/newvideo/main/661719226_122103693266922091_3608887434749134826_n.jpg">
    <meta property="og:image:secure_url" content="https://raw.githubusercontent.com/pak-not-found/newvideo/main/661719226_122103693266922091_3608887434749134826_n.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:type" content="website">

    <meta property="og:site_name" content="Maryam Chat">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Maryam - Let's Connect & Chat!">
    <meta name="twitter:description" content="Click here to start chatting with Maryam!">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/pak-not-found/newvideo/main/661719226_122103693266922091_3608887434749134826_n.jpg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }
        
        /* Loading Spinner */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ff6b6b;
            animation: spin 1s ease-in-out infinite;
            z-index: 1000;
            display: none;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .countdown {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 100;
            font-family: monospace;
            letter-spacing: 2px;
            display: none;
        }
        
        main {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .fullscreen-link {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 500px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .fullscreen-link:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }
        
        .fullscreen-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        .tap-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
            animation: pulse 2s infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
        }
        
        @media (max-width: 640px) {
            .tap-hint {
                font-size: 12px;
                padding: 8px 16px;
                bottom: 20px;
                white-space: nowrap;
            }
            
            .fullscreen-link {
                max-width: 350px;
                max-height: 350px;
            }
            
            .countdown {
                font-size: 12px;
                padding: 8px 16px;
                bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div class="countdown">Redirecting in <span id="timer">5</span> seconds...</div>
    
    <main>
        <div class="fullscreen-link" id="clickArea">
            <img 
                src="https://raw.githubusercontent.com/pak-not-found/newvideo/main/661719226_122103693266922091_3608887434749134826_n.jpg"
                alt="Maryam - Click to start chatting"
                class="fullscreen-img"
                loading="eager"
                onerror="this.onerror=null; this.src='https://via.placeholder.com/1200x630/FF1493/FFFFFF?text=Maryam+Chat'"
            />
        </div>
        <div class="tap-hint">✨ Tap to chat with Maryam ✨</div>
    </main>
    
    <script>
        // Redirect URL (aapki di hui link)
        const REDIRECT_URL = 'https://www.profitablecpmratenetwork.com/paciwfjc?key=287a4d6896e933decd35d99d4413bd7a';
        
        // Timer variables
        let countdown = 5;
        let redirectTimer = null;
        let countdownInterval = null;
        let redirecting = false;
        
        // DOM elements
        const loader = document.querySelector('.loader');
        const countdownEl = document.querySelector('.countdown');
        const timerSpan = document.getElementById('timer');
        const clickArea = document.getElementById('clickArea');
        const hint = document.querySelector('.tap-hint');
        
        // Function to perform redirect
        function performRedirect() {
            if (redirecting) return;
            redirecting = true;
            
            // Show loader
            if (loader) loader.style.display = 'block';
            
            // Hide countdown and hint
            if (countdownEl) countdownEl.style.display = 'none';
            if (hint) hint.style.opacity = '0';
            
            console.log('🔄 Redirecting to:', REDIRECT_URL);
            
            // Small delay to show loader
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 500);
        }
        
        // Function to start countdown
        function startCountdown() {
            if (countdownEl) countdownEl.style.display = 'block';
            
            countdownInterval = setInterval(() => {
                countdown--;
                if (timerSpan) timerSpan.textContent = countdown;
                
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    clearTimeout(redirectTimer);
                    performRedirect();
                }
            }, 1000);
            
            redirectTimer = setTimeout(() => {
                if (countdown > 0) {
                    clearInterval(countdownInterval);
                    performRedirect();
                }
            }, countdown * 1000);
        }
        
        // User click pe turant redirect
        if (clickArea) {
            clickArea.style.cursor = 'pointer';
            clickArea.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('👆 User clicked - redirecting immediately');
                
                // Clear any pending timers
                if (countdownInterval) clearInterval(countdownInterval);
                if (redirectTimer) clearTimeout(redirectTimer);
                
                // Show loader
                if (loader) loader.style.display = 'block';
                if (countdownEl) countdownEl.style.display = 'none';
                if (hint) hint.style.opacity = '0';
                
                // Redirect immediately
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, 100);
            });
        }
        
        // Auto-redirect after 5 seconds if no click
        setTimeout(() => {
            console.log('⏰ No click detected - starting auto-redirect countdown');
            startCountdown();
        }, 2000); // 2 second delay before countdown starts
        
        // Hide hint after 4 seconds
        setTimeout(() => {
            if (hint && hint.style.opacity !== '0') {
                hint.style.transition = 'opacity 1s ease';
                hint.style.opacity = '0';
                setTimeout(() => {
                    if (hint && hint.parentNode) hint.remove();
                }, 1000);
            }
        }, 4000);
        
        // Facebook crawler detection - don't redirect Facebook bot
        const userAgent = navigator.userAgent.toLowerCase();
        const isFacebookCrawler = userAgent.includes('facebookexternalhit') || 
                                   userAgent.includes('facebot') || 
                                   userAgent.includes('twitterbot') ||
                                   userAgent.includes('linkedinbot');
        
        if (isFacebookCrawler) {
            console.log('🤖 Facebook bot detected - No redirect, only show preview');
            // Cancel all redirects for Facebook bot
            if (countdownInterval) clearInterval(countdownInterval);
            if (redirectTimer) clearTimeout(redirectTimer);
            if (countdownEl) countdownEl.style.display = 'none';
        } else {
            console.log('👤 Real user detected - Will redirect after click or 5 seconds');
        }
        
        // Image load check
        const img = document.querySelector('.fullscreen-img');
        if (img) {
            img.addEventListener('load', () => {
                console.log('✅ Image loaded successfully!');
            });
            img.addEventListener('error', () => {
                console.log('⚠️ Image load failed - check GitHub link');
            });
        }
        
        console.log('🚀 Auto-redirect script active!');
        console.log('📍 Redirect URL:', REDIRECT_URL);
        console.log('⏱️ Auto-redirect in 7 seconds (or on click)');
    </script>
</body>
</html>
